name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Pack smoke check
        run: |
          pnpm pack --pack-destination /tmp
          size=$(stat -c%s /tmp/panindigan-automate-*.tgz)
          echo "tarball size: $size bytes"
          if [ "$size" -gt 3000000 ]; then
            echo "::error::pack grew beyond 3MB — inspect what leaked in"
            exit 1
          fi
